name: Build and publish Docker images
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/godextreme/securo
jobs:
  build:
    # The NAS that runs these images also builds them. Safe here and not in
    # ci.yml because this workflow never runs on a pull request: a public
    # repository would otherwise let any fork execute code on the machine.
    #
    # No second label. A runner is registered to one repository and only
    # that one can send it work, so naming the repository was always
    # redundant — and naming the *machine* would be worse than redundant:
    # it would keep a second host (a desktop taking load off the NAS) from
    # picking up these jobs, for no benefit. Every self-hosted runner
    # carries `self-hosted`, so this matches whichever of them is free.
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: backend
          - name: frontend
            context: ./frontend
            image: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The daemon's own builder, not a fresh docker-container one: the
          # runner is long-lived, so the layers from the last build are
          # still on the NAS and a container builder would start cold every
          # time. (GitHub-hosted runners ship buildx; this machine does not,
          # so the step is required, not an optimisation.)
          driver: docker
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
